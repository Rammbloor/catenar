name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0

jobs:
  verify:
    name: release-gates
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run check
          npm test -- --run
          npm run build

      - name: Verify Go services
        run: go test ./...

  build:
    name: build-${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libfuse2

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Set version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e "
            const fs = require('fs');
            const p = 'wails.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.info = j.info || {};
            j.info.productVersion = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Build macOS app
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "\
            -X main.appVersion=${{ env.VERSION }} \
            -X main.githubRepo=${{ github.repository }}"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -platform ${{ matrix.platform }} -nsis -ldflags `
            "-X main.appVersion=${{ env.VERSION }} `
             -X main.githubRepo=${{ github.repository }}"

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "\
            -X main.appVersion=${{ env.VERSION }} \
            -X main.githubRepo=${{ github.repository }}"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp -R build/bin/Catenar.app "Catenar.app"
          ditto -c -k --sequesterRsrc --keepParent "Catenar.app" "release/catenar-${VERSION}-darwin-universal.zip"
          rm -rf "Catenar.app"

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $installer = Get-ChildItem build\bin\*installer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in build\bin" }
          Copy-Item $installer.FullName "release\catenar-$env:VERSION-windows-amd64-installer.exe"
          $raw = Get-ChildItem build\bin\*.exe -Exclude *installer* -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($raw) { Copy-Item $raw.FullName "release\catenar-$env:VERSION-windows-amd64.exe" }

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          binary="$(find build/bin -maxdepth 1 -type f -perm -111 | head -n 1)"
          test -n "$binary"
          cp "$binary" release/catenar-${VERSION}-linux-amd64
          chmod +x release/catenar-${VERSION}-linux-amd64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catenar-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Bug fixes and improvements' > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
