name: ci

on:
  push:
  pull_request:

jobs:
  build-smoke:
    name: build-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
          - os: ubuntu-22.04
            platform: linux/amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config libfuse2

      - name: Frontend typecheck and tests
        working-directory: frontend
        run: |
          npm run check
          npm run test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test ./...

      - name: Wails packaging smoke build (macOS)
        if: runner.os == 'macOS'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Wails packaging smoke build (Windows and Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }}
